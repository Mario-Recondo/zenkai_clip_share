<article class="group"{% if clip.status == 'PENDING' or clip.status == 'PROCESSING' %} data-poll-status="{% url 'clip-status' clip.pk %}"{% endif %}>
    <a href="{% url 'clip-detail' clip.pk %}" class="relative block aspect-video overflow-hidden rounded-xl border border-ink-700 bg-ink-900">
        {% if clip.thumbnail %}
            <img src="{{ clip.thumbnail.url }}" alt="" loading="lazy" class="size-full object-cover transition-transform duration-300 group-hover:scale-105">
        {% else %}
            <div class="js-media flex size-full items-center justify-center" aria-hidden="true">
                <svg class="size-10 text-ink-600" fill="currentColor" viewBox="0 0 24 24">
                    <path d="M8 5.14v13.72L19 12 8 5.14z"/>
                </svg>
            </div>
        {% endif %}
        {% if clip.visibility == 'UNLISTED' %}
            <span class="absolute top-2 left-2 inline-flex items-center gap-1 rounded-md bg-ink-950/90 px-2 py-0.5 text-xs font-medium text-ink-300" title="Only visible in collections and to people with the link">
                <svg class="size-3" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M3.98 8.22A10.5 10.5 0 0 0 1.93 12c1.27 4.06 5.06 7 9.57 7 .99 0 1.95-.14 2.85-.4M6.23 6.23A10.45 10.45 0 0 1 11.5 5c4.51 0 8.3 2.94 9.57 7a10.52 10.52 0 0 1-4.3 5.27M6.23 6.23 3 3m3.23 3.23 3.65 3.65m7.89 7.89L21 21m-3.23-3.23-3.65-3.65m0 0a3 3 0 1 0-4.24-4.24m4.24 4.24L9.88 9.88"/>
                </svg>
                Unlisted
            </span>
        {% endif %}
        {% if clip.status == 'FAILED' %}
            <span class="js-status-badge absolute bottom-2 left-2 rounded-md bg-red-950/90 px-2 py-0.5 text-xs font-medium text-red-300">Failed</span>
        {% elif clip.status != 'READY' %}
            <span class="js-status-badge absolute bottom-2 left-2 rounded-md bg-ink-950/90 px-2 py-0.5 text-xs font-medium text-ink-300">Processing</span>
        {% endif %}
        <span class="absolute inset-0 flex items-center justify-center bg-ink-950/40 opacity-0 transition-opacity duration-200 group-hover:opacity-100" aria-hidden="true">
            <span class="flex size-12 items-center justify-center rounded-full bg-flame-600">
                <svg class="ml-0.5 size-5 text-white" fill="currentColor" viewBox="0 0 24 24">
                    <path d="M8 5.14v13.72L19 12 8 5.14z"/>
                </svg>
            </span>
        </span>
    </a>
    <h2 class="mt-2.5 font-semibold leading-snug tracking-tight">
        <a href="{% url 'clip-detail' clip.pk %}" class="line-clamp-2 transition-colors hover:text-flame-400">{{ clip.title }}</a>
    </h2>
    <p class="mt-0.5 text-sm text-ink-400">
        <a href="{% url 'user-clips' clip.uploader.username %}" class="transition-colors hover:text-flame-400">{{ clip.uploader.username }}</a>
        <span aria-hidden="true">&middot;</span>
        {{ clip.date_uploaded|date:"M j, Y" }}
    </p>
</article>
