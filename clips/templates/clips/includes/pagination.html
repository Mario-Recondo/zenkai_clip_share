{% if page_obj.has_other_pages %}
    <nav class="mt-10 flex items-center justify-center gap-4" aria-label="Pagination">
        {% if page_obj.has_previous %}
            <a href="?page={{ page_obj.previous_page_number }}{% if request.GET.q %}&amp;q={{ request.GET.q|urlencode }}{% endif %}" class="btn btn-secondary">&larr; Prev</a>
        {% endif %}
        <span class="text-sm text-ink-400">Page {{ page_obj.number }} of {{ page_obj.paginator.num_pages }}</span>
        {% if page_obj.has_next %}
            <a href="?page={{ page_obj.next_page_number }}{% if request.GET.q %}&amp;q={{ request.GET.q|urlencode }}{% endif %}" class="btn btn-secondary">Next &rarr;</a>
        {% endif %}
    </nav>
{% endif %}
