{% extends 'base.html' %}

{% block content %}
    <div class="mx-auto max-w-xl">
        <h1 class="text-2xl font-bold tracking-tight">Upload a clip</h1>
        <p class="mt-1 text-sm text-ink-400">MP4, MOV, WebM, MKV or AVI &middot; up to 90 seconds &middot; max 200&nbsp;MB.</p>

        <form method="post" enctype="multipart/form-data" class="form-stack card mt-6 p-6">
            {% csrf_token %}
            {{ form.as_p }}
            <div class="flex gap-3">
                <a href="{% url 'clip-list' %}" class="btn btn-secondary flex-1">Cancel</a>
                <button type="submit" class="btn btn-primary flex-1">Upload clip</button>
            </div>
        </form>
    </div>
{% endblock %}
