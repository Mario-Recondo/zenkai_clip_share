{% extends 'base.html' %}

{% block header %}{% endblock %}

{% block content %}
    <div class="mx-auto mt-10 max-w-sm">
        <p class="text-center text-2xl font-bold tracking-tight">
            Zenkai<span class="text-ember-500">Clips</span>
        </p>

        {% if request.GET.timeout %}
            <p class="mt-6 rounded-lg border border-ember-500/30 bg-ember-500/10 px-4 py-3 text-center text-sm text-ember-200">
                You were logged out due to inactivity. Please log in again.
            </p>
        {% endif %}

        <div class="card mt-6 p-6">
            <h1 class="text-center text-xl font-semibold tracking-tight">Welcome back</h1>
            <form method="post" class="form-stack mt-6">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit" class="btn btn-primary w-full">Log in</button>
            </form>
        </div>

        <p class="mt-4 text-center text-sm text-ink-400">
            Need an account? <a href="{% url 'register' %}" class="font-medium text-ember-400 transition-colors hover:text-ember-300">Sign up</a>
        </p>
    </div>
{% endblock %}
