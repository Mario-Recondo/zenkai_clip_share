{% extends 'base.html' %}

{% block content %}
    <div class="mx-auto max-w-xl">
        <div class="card flex items-center gap-4 p-6">
            {% if user.profile.profile_picture %}
                <img src="{{ user.profile.profile_picture.url }}" alt="Profile picture" class="size-16 rounded-full object-cover">
            {% else %}
                <div class="flex size-16 items-center justify-center rounded-full bg-ink-700 text-2xl font-bold uppercase text-ink-300" aria-hidden="true">{{ user.username|first }}</div>
            {% endif %}
            <div class="min-w-0">
                <h1 class="text-xl font-semibold tracking-tight">{{ user.username }}</h1>
                {% if user.profile.bio %}
                    <p class="mt-0.5 text-sm text-ink-400">{{ user.profile.bio }}</p>
                {% endif %}
            </div>
            <a href="{% url 'user-clips' user.username %}" class="btn btn-secondary ml-auto shrink-0">My clips</a>
        </div>

        <div class="card mt-6 p-6">
            <h2 class="text-lg font-semibold tracking-tight">Edit profile</h2>
            <form method="post" enctype="multipart/form-data" class="form-stack mt-5">
                {% csrf_token %}
                {{ p_form.as_p }}
                <button type="submit" class="btn btn-primary">Save changes</button>
            </form>
        </div>
    </div>
{% endblock %}
